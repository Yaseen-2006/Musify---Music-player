<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0c0d">
  <title>Musify Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="currentColor"/><path d="M13 27V13l14 14V13" stroke="#f3ece8" stroke-width="3" fill="none"/></svg>
        <div><strong>MUSIFY</strong><small>Your music. Your library.</small></div>
      </div>
      <!-- Search now lives on the Home page, so there is no Search tab -->
      <nav id="nav" aria-label="Main navigation">
        <button data-view="home" class="active" aria-current="page"><svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></svg>Home</button>
        <button data-view="library"><svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="4" height="16" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><path d="M16.5 5.5l3.5 14"/></svg>Library</button>
        <button data-view="favorites"><svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.6-8 11-8 11z"/></svg>Favorites</button>
        <button data-view="artists"><svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Artists</button>
      </nav>
    </aside>

    <main>
      <div class="topbar">
        <button class="btn primary" data-action="choose">Choose Music Folder</button>
        <button class="btn" data-action="refresh">Refresh Library</button>
        <label class="auto" title="Only rescans when song folders are added or removed"><input type="checkbox" id="autoRefresh"> Auto-refresh every 30s</label>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="view"></div>
    </main>

    <footer class="player">
      <div class="now">
        <img id="pCover" alt="Current song artwork">
        <div class="meta"><b id="pTitle">Nothing playing</b><span id="pArtist">Choose a song</span></div>
        <button id="pFav" class="icon heart" data-fav="" aria-label="Toggle favorite" aria-pressed="false"></button>
      </div>
      <div class="center">
        <div class="ctrls">
          <button id="prevBtn" class="icon" aria-label="Previous song"></button>
          <button id="playBtn" class="icon big" aria-label="Play or pause"></button>
          <button id="nextBtn" class="icon" aria-label="Next song"></button>
        </div>
        <div class="bar">
          <span id="cur">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
          <span id="dur">0:00</span>
        </div>
      </div>
      <div class="volume">
        <button id="muteBtn" class="icon" aria-label="Mute or unmute"></button>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
      </div>
    </footer>
  </div>
  <audio id="audio"></audio>
  <input type="file" id="zipInput" accept=".zip,application/zip,application/x-zip-compressed" hidden>
  <script src="script.js"></script>
</body>
</html>
